<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D3buff — Все работы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=135" />
</head>
<body>

  <!-- CUSTOM CURSOR -->
  <div id="custom-cursor">
    <img src="images/Cursor.png" id="cursor-img" alt="Cursor">
  </div>
  
  <!-- BLUR FILTER FOR CURSOR -->
  <svg width="0" height="0" style="position: absolute; display: none;">
    <filter id="motionBlur">
      <feGaussianBlur id="blurElement" in="SourceGraphic" stdDeviation="0 0" />
    </filter>
  </svg>

  <!-- HEADER -->
  <header class="header" id="top">
    <div class="container header__inner">
      <a href="index.html" class="logo notranslate">Debuff<span class="logo-dot">.</span></a>
      <nav class="nav" id="siteNav">
        <span class="nav__indicator" aria-hidden="true"></span>
        <a href="index.html#about">Обо мне</a>
        <a href="index.html#skills">Навыки</a>
        <a href="index.html#works">Работы</a>
        <a href="index.html#contact">Контакт</a>
      </nav>
      <div class="header-controls">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему">
          <svg class="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3V4M12 20V21M4 12H3M6.31412 6.31412L5.5 5.5M17.6859 6.31412L18.5 5.5M6.31412 17.69L5.5 18.5M17.6859 17.69L18.5 18.5M21 12H20M16 12C16 14.2091 14.2091 16 12 16C9.79086 16 8 14.2091 8 12C8 9.79086 9.79086 8 12 8C14.2091 8 16 9.79086 16 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="header-controls__divider" aria-hidden="true"></span>
        <div class="lang-toggle notranslate" id="langWrap" role="group" aria-label="Язык">
          <span class="lang-toggle__thumb" aria-hidden="true"></span>
          <button type="button" class="lang-toggle__opt" data-lang="ru" aria-pressed="true">RU</button>
          <button type="button" class="lang-toggle__opt" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <button class="nav-burger" id="navBurger" type="button" aria-label="Меню" aria-expanded="false" aria-controls="siteNav">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav-backdrop" id="navBackdrop" aria-hidden="true"></div>
  </header>

  <!-- PAGE HERO -->
  <section class="jobs-hero">
    <div class="container jobs-hero__inner">
      <a href="index.html" class="back-btn reveal reveal--fade">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="back-btn__label">Назад</span>
      </a>
      <h1 class="jobs-hero__title reveal reveal--up">Все <span class="red">работы</span></h1>
      <p class="jobs-hero__sub reveal reveal--fade delay-1">Полный архив проектов</p>
    </div>
  </section>

  <!-- ALL WORKS -->
  <section class="jobs-works">
    <div class="container">
      <div class="jobs-group">
        <h2 class="jobs-group__title"><span class="jobs-group__dash" aria-hidden="true">—</span>Дизайн</h2>
        <div class="masonry masonry--bleed" id="jobsMasonry"></div>
      </div>
      <div id="jobsExtra"></div>

      <div class="jobs-back-bottom">
        <a href="index.html" class="btn btn--outline">← Вернуться на главную</a>
      </div>
    </div>
  </section>

  <div class="footer-rule" aria-hidden="true"></div>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__grid">
      <div class="footer__cell footer__cell--media">
        <div class="footer__slideshow" id="footerSlideshow" aria-hidden="true"></div>
        <img class="footer__thx" src="images/thx.png" alt="" aria-hidden="true" />
      </div>
      <div class="footer__cell footer__cell--copy">
        <div class="footer__copy">
          <p class="footer__brand notranslate">D3BUFF<span>.</span></p>
          <p class="footer__line">© <span id="footerYear">2026</span> · Все права защищены</p>
          <div class="footer__links">
            <a href="index.html#contact">Контакт</a>
            <a href="index.html">На главную</a>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <!-- SCROLL TO TOP -->
  <button class="scroll-top" id="scrollTop" aria-label="Наверх">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M3 12L9 6L15 12" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Просмотр изображения">
    <button class="lightbox__close" id="lightboxClose" aria-label="Закрыть">✕</button>
    <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" type="button" aria-label="Предыдущая">‹</button>
    <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" type="button" aria-label="Следующая">›</button>
    <div class="lightbox__backdrop" id="lightboxBackdrop"></div>
    <div class="lightbox__content">
      <img src="" alt="" id="lightboxImg" />
      <p class="lightbox__title" id="lightboxTitle"></p>
      <p class="lightbox__desc" id="lightboxDesc" hidden></p>
    </div>
  </div>

  <div id="google_translate_element" class="gt-hidden"></div>
  <script>
  window.googleTranslateElementInit = function () {
    new google.translate.TranslateElement({
      pageLanguage: 'ru',
      includedLanguages: 'ru,en,uk,de,fr,es,pl,tr,zh-CN,ja',
      autoDisplay: false
    }, 'google_translate_element');
  };
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script src="js/lang.js?v=8"></script>
  <script src="js/works-data.js?v=5"></script>
  <script src="js/script.js?v=51"></script>
</body>
</html>
